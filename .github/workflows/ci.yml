name: CI

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }} — test, clippy, fmt
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mush

      - name: cargo fmt --check
        working-directory: mush
        run: cargo fmt --all -- --check

      - name: cargo clippy -- -D warnings
        working-directory: mush
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test --release
        working-directory: mush
        run: cargo test --release --all-targets

  smoke:
    name: ${{ matrix.os }} — two-node smoke
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mush

      - name: Build release binary
        working-directory: mush
        run: cargo build --release --bin mush-node

      - name: "Smoke: two nodes exchange a message"
        working-directory: mush
        run: bash scripts/smoke.sh

  android-build:
    name: android — cargo-ndk + assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mush/mush-android
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mush

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install NDK 26
        run: sdkmanager --install "ndk;26.1.10909125" "platforms;android-34" "build-tools;34.0.0"

      - name: Build JNI libs (aarch64, armv7, x86_64)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_SDK_ROOT }}/ndk/26.1.10909125
        run: |
          cargo ndk -t arm64-v8a -t armv7 -t x86_64 \
            -o app/src/main/jniLibs build --release -p mush-jni

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      - name: Verify .so inside APK
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk)
          unzip -l "$APK" | grep '\.so$'

      - uses: actions/upload-artifact@v4
        with:
          name: mush-android-debug
          path: mush/mush-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
