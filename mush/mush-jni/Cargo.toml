[package]
name = "mush-jni"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "JNI bridge: Kotlin <-> mush-core (Mush A' Android)"

[lib]
# cdylib — для APK; rlib — чтобы host-тесты (`cargo test`) линковали крейт.
crate-type = ["cdylib", "rlib"]

[dependencies]
mush-core = { path = "../mush-core" }
jni = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
once_cell = "1"
tracing = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
tracing-android = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
